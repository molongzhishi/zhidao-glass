name: multimodal_chat
description: "Multimodal AI Chat App with offline LLM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  record: ^7.0.0
  permission_handler: ^11.3.1
  flutter_tts: ^4.0.2

  image_picker: ^1.1.2

  path_provider: ^2.1.3
  dio: ^5.5.0

  provider: ^6.1.2

  shared_preferences: ^2.3.4
  sqflite: ^2.4.2
  path: ^1.9.1

  flutter_gemma: ^0.15.3
  sherpa_onnx: ^1.13.4


  flutter_blue_plus: ^1.33.0
  ultralytics_yolo: ^0.6.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:
  uses-material-design: true
  assets:
    - assets/models/yolo26n_w8a32.tflite
    - assets/models/silero_vad.int8.onnx
